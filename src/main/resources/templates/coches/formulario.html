<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<!-- Un único formulario para CREAR y EDITAR: si el coche tiene id, estamos editando -->
<head th:replace="~{fragments/layout :: head(${coche.id == null} ? 'Nuevo coche' : 'Editar coche')}"></head>
<body class="tema-premium">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-4" style="max-width: 820px;">
    <h1 class="h3 mb-3 titulo-seccion" th:text="${coche.id == null} ? 'Nuevo coche' : 'Editar coche'">Coche</h1>

    <div class="panel-premium">
        <div class="p-4">
            <form th:action="${coche.id == null} ? @{/coches} : @{/coches/{id}(id=${coche.id})}"
                  th:object="${coche}" method="post" novalidate>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="marca" class="form-label">Marca</label>
                        <input type="text" th:field="*{marca}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{marca}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="modelo" class="form-label">Modelo</label>
                        <input type="text" th:field="*{modelo}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{modelo}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="matricula" class="form-label">Matrícula</label>
                        <input type="text" th:field="*{matricula}" class="form-control text-uppercase"
                               placeholder="1234ABC" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{matricula}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="anio" class="form-label">Año</label>
                        <input type="number" th:field="*{anio}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{anio}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="color" class="form-label">Color</label>
                        <input type="text" th:field="*{color}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{color}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="precio" class="form-label">Precio</label>
                        <div class="input-group has-validation">
                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" th:errorclass="is-invalid">
                            <span class="input-group-text">€</span>
                            <div class="invalid-feedback" th:errors="*{precio}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="kilometraje" class="form-label">Kilometraje</label>
                        <div class="input-group has-validation">
                            <input type="number" th:field="*{kilometraje}" class="form-control" th:errorclass="is-invalid">
                            <span class="input-group-text">km</span>
                            <div class="invalid-feedback" th:errors="*{kilometraje}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="combustible" class="form-label">Combustible</label>
                        <select th:field="*{combustible}" class="form-select" th:errorclass="is-invalid">
                            <option value="">-- Selecciona --</option>
                            <option th:each="op : ${combustibles}" th:value="${op}" th:text="${op.etiqueta}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{combustible}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="transmision" class="form-label">Transmisión</label>
                        <select th:field="*{transmision}" class="form-select" th:errorclass="is-invalid">
                            <option value="">-- Selecciona --</option>
                            <option th:each="op : ${transmisiones}" th:value="${op}" th:text="${op.etiqueta}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{transmision}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/coches}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-gold">
                        <i class="bi bi-floppy"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
