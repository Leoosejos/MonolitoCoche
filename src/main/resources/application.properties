spring.application.name=MonolitoCoche

# ===== Servidor web =====
# Puerto donde escucha la aplicación (por defecto sería 8080)
server.port=8081

# ===== Conexión a MySQL =====
# La base de datos se crea automáticamente si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/monolito_coche?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===== Scripts SQL de inicialización =====
# Al arrancar se ejecutan: 1) db/schema.sql (tablas)  2) db/data.sql (10 coches de ejemplo)
# Ambos son idempotentes. Pon "never" para desactivarlos.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

# ===== JPA / Hibernate =====
# none: Hibernate NO toca la estructura; la tabla la crea db/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
# Desactiva la caché para ver los cambios de las vistas sin reiniciar (solo desarrollo)
spring.thymeleaf.cache=false
