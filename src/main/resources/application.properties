spring.application.name=MonolitoCoche

# ===== Servidor web =====
# Puerto donde escucha la aplicación (por defecto sería 8080)
server.port=8081

# ===== Conexión a MySQL (JDBC) =====
# Estos valores los lee la clase repository/Conexion (Singleton) al crear la conexión.
# Las tablas NO se crean solas: ejecuta db/schema.sql y db/data.sql (ver cabecera de cada archivo).
spring.datasource.url=jdbc:mysql://localhost:3306/monolito_coche?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===== Thymeleaf =====
# Desactiva la caché para ver los cambios de las vistas sin reiniciar (solo desarrollo)
spring.thymeleaf.cache=false
